[package]
name = "nmor"
version = "0.2.0"
edition = "2024"
description = "Nmor - Linux-first asynchronous TCP network scanner"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
